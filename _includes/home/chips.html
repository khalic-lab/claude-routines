{%- comment -%} The beat chips: one control painted by one module wherever it renders (the rail, the bar's strip, the phone sheet). Pressed chips carry a check (F4: multi-select, signalled). {%- endcomment -%}
<button class="chip" type="button" data-topic="" aria-pressed="true"><span class="chip__l">All beats</span><span class="ct num">{{ include.feed.board.size }}</span></button>
{%- for t in include.feed.beats -%}
<button class="chip" type="button" data-topic="{{ t.key }}" aria-pressed="false"><i class="dot" aria-hidden="true" style="--tc:{{ t.color }}"></i><span class="chip__l">{{ t.label | escape }}</span><span class="ct num">{{ t.count }}</span></button>
{%- endfor -%}
