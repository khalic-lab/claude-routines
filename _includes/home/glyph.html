{%- comment -%} The tier, from ONE module (R10): a glyph (lead a red disc, feature an ink square, brief a bare rule) and its word; `quiet` keeps the word for assistive tech only. {%- endcomment -%}
<span class="tier" data-imp="{{ include.imp }}"><i class="tg tg--{{ include.tier }}" aria-hidden="true"></i><span class="{% if include.quiet %}vh{% else %}tier__w{% endif %}">{{ include.label }}</span></span>
