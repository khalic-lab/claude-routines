{%- comment -%} More (when the item folds), then ✓ and the two votes. All need script. {%- endcomment -%}
{%- if include.fold and include.fold != "" -%}
<button class="more needs-js" type="button" aria-expanded="{% if include.open %}true{% else %}false{% endif %}" aria-controls="{{ include.fold }}"><svg aria-hidden="true" width="9" height="9" viewBox="0 0 10 10"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>{% if include.open %}Less{% else %}More{% endif %}</span></button>
{%- endif -%}
