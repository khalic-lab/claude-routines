{%- comment -%} The read-state segment: All / Unread / Read, each with the honest count of what it would show (C12). {%- endcomment -%}
<div class="seg" role="group" aria-label="Read state">
  <button type="button" data-rs="" aria-pressed="true">All<span class="ct num">{{ include.n }}</span></button>
  <button type="button" data-rs="unread" aria-pressed="false">Unread<span class="ct num">{{ include.n }}</span></button>
  <button type="button" data-rs="read" aria-pressed="false">Read<span class="ct num">0</span></button>
</div>
