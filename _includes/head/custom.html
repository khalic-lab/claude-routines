<script>
  // The theme's seo.html composes <title> as "{page.title} - {site.title}" with NO dedup guard,
  // so the homepage tab reads "News - News". Collapse the exact duplicate here instead of
  // forking the whole theme include for one line.
  (function(){ var m = document.title.match(/^(.*) - \1$/); if (m) document.title = m[1]; })();
</script>
<script>
// (The brief-page machinery that used to live in this file — story-tagger, article-preview/og-image
// loader, per-story + overall feedback widgets and their CSS — was deleted 2026-07-18 when the
// individual brief pages were retired; only the evaluator review still renders as a post. It is
// recoverable from git history if brief pages ever come back.)

// Workaround for minimal-mistakes assuming .page__content always exists.
// Theme's main.min.js does `document.querySelector(".page__content").querySelectorAll(...)`
// which throws on layouts without that wrapper (e.g. layout: home). Stub it in.
document.addEventListener('DOMContentLoaded', function () {
  if (!document.querySelector('.page__content')) {
    var stub = document.createElement('div');
    stub.className = 'page__content';
    stub.style.display = 'none';
    document.body.appendChild(stub);
  }
}, { once: true });

<!-- ============================================================================
     Editorial restyle v3 — single column, real headlines, large figures, light+dark.
     Layered over minimal-mistakes "default" skin; loads last in <head>.
     Knobs: the CSS variables in :root (light) + the prefers-color-scheme block (dark).
     ========================================================================= -->
<!-- Folio identity (2026-07-06): system New York serif ('ui-serif' on Apple) + Helvetica, no webfont
     fetch. Dropping the Google Fonts links removes an external request and its CSP surface; the old
     Fraunces/Inter/Source-Serif faces are gone. Cool bone paper + ink-indigo accent, light & dark. -->
<style>
  /* ONE palette, both schemes. `light-dark()` replaces the old :root + prefers-color-scheme
     duplicate pair — every token below reads light-value-first, dark-value-second, so a colour
     can no longer drift between the two blocks (it was two edits per change; now it is one).
     `color-scheme` is what arms light-dark(), and it also hands the UA the scheme for form
     controls, scrollbars and the canvas — which is why several "stop the stock skin flashing
     white" patches further down are no longer doing the work they were written for.
     Baseline-newly-available (Chrome 123 / Safari 17.5 / Firefox 120). Tokens are consumed only
     as colours, never inside another function, which is the constraint light-dark() imposes.
     The harness (tools/home_harness.py) EXTRACTS this block by regex rather than mirroring it —
     do not reformat the `:root{` … `}` delimiters without checking there. */
  :root{
    color-scheme: light dark;
    --paper:      light-dark(#eceae4, #14151a);
    --panel:      light-dark(#e2e1d9, #1d1e25);
    --card:       light-dark(#f3f2ec, #1a1b21);
    --ink:        light-dark(#23252b, #e7e5dd);
    --muted:      light-dark(#5f616a, #9a9ca6);
    --muted-ui:   light-dark(#565863, #b0b2bb);
    --rule:       light-dark(rgb(35 37 43 / .62), rgb(231 229 221 / .5));
    --hair:       light-dark(rgb(35 37 43 / .14), rgb(231 229 221 / .13));
    --field:      light-dark(#f6f5f0, rgb(255 255 255 / .05));
    --frame:      light-dark(rgb(35 37 43 / .46), rgb(231 229 221 / .3));
    --accent:     light-dark(#2b3f6b, #8fa9df);
    --accent-chip:       light-dark(#3a3d47, #4a4d57);
    --accent-chip-hover: light-dark(#2b2e36, #565a65);
    --serif:ui-serif,'New York','Iowan Old Style',Charter,Georgia,'Times New Roman',serif;
    --display:ui-serif,'New York','Iowan Old Style',Georgia,serif;
    --sans:'Helvetica Neue',Helvetica,Arial,-apple-system,BlinkMacSystemFont,sans-serif;
  }

  html,body{ background:var(--paper); color:var(--ink); }
  body{ font-family:var(--serif); text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; }
  #main,.initial-content,.page,.archive,.masthead,.greedy-nav,.greedy-nav .visible-links{ background:var(--paper); }
  /* secondary theme surfaces that otherwise flash the stock white skin in dark mode */
  .greedy-nav .hidden-links{ background:var(--paper); }
  .sidebar,.toc__menu,.notice,.notice--primary,.notice--info,.notice--warning{ background:var(--panel); color:var(--ink); }
  .page__content{ font-size:1.06rem; line-height:1.6; max-width:40em; margin-left:auto; margin-right:auto; }
  .page__content p{ margin:0 0 1em; }
  /* prose links only — leave theme chrome (pagination/taxonomy/breadcrumbs) to the skin */
  .page__content a{ color:var(--ink); text-decoration:underline; text-decoration-thickness:1px;
    text-underline-offset:2px; text-decoration-color:var(--muted-ui); }
  .page__content a:hover{ color:var(--accent); text-decoration-color:var(--accent); }
  strong,.page__content strong{ font-weight:600; }

  /* masthead — quiet, sans nav */
  .masthead{ border-bottom:1px solid var(--rule); }
  .site-title{ font-family:var(--display); font-weight:700; letter-spacing:-.01em; font-size:1.3em; color:var(--ink); }
  .greedy-nav a{ font-family:var(--sans); text-transform:uppercase; letter-spacing:.12em; font-size:.72em;
    font-weight:500; color:var(--ink); }

  /* article masthead */
  .page__title{ font-family:var(--display); font-weight:700; line-height:1.05; letter-spacing:-.012em;
    font-size:2.3em; margin:.1em 0 .35em; }
  .page__meta{ font-family:var(--sans); text-transform:uppercase; letter-spacing:.08em; font-weight:500;
    font-size:.7em; color:var(--muted-ui); border:0; padding:0; margin:0 0 1.6em; }

  /* section headers — tracked sans kicker, rule above (leading emoji stripped by the script below) */
  .page__content h2{ font-family:var(--sans); font-weight:600; text-transform:uppercase; letter-spacing:.14em;
    font-size:.82em; color:var(--muted-ui); margin:2.4em 0 1.2em; padding-top:1em; border-top:1px solid var(--rule); }
  .page__content h2:first-of-type{ margin-top:.7em; }
  .page__content h3{ font-family:var(--display); font-weight:600; font-size:1.25em; line-height:1.25; margin:1.6em 0 .4em; }
  /* Headings must use --ink. Two theme traps to override:
     (1) the skin colors h1..h6 + .page__title, and our dark-mode block only swaps the --ink
         *variable* (not these rules) — so any heading we don't explicitly style (h1, h3, h4) could
         keep a dark theme color and vanish on the dark paper; and
     (2) .page__title wraps its whole text in a self-permalink <a>, which the theme colors #3d4144
         (slate). That LINK, not the h1, is the visible title — measured 1.79:1 on dark paper — so it
         must be re-inked too. The theme's `.page__title a` rule ties our specificity and wins on
         source order (and :visited is sticky), so force it with !important. h2 keeps its muted
         kicker color (set above, excluded here on purpose). */
  .page__title,
  .page__content h1, .page__content h3, .page__content h4, .page__content h5, .page__content h6{ color:var(--ink); }
  .page__title a, .page__title a:visited{ color:var(--ink) !important; }
  /* The brief's first in-body H1 (e.g. "AI/ML Brief — {date}") repeats the masthead page title
     verbatim — two loud stacked titles. Demote it so the masthead title leads the hierarchy. */
  .page__content h1{ font-size:1.5em; line-height:1.2; margin:.2em 0 .6em; }


  /* tags as delicate pills */
  .page__content code{ font-family:var(--sans); font-size:.72em; font-weight:500; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); background:transparent; border:1px solid var(--hair);
    border-radius:999px; padding:.12em .6em; }
  /* the theme tags inline code as `.highlighter-rouge` with a light #fafafa background at higher
     specificity (code.language-plaintext.highlighter-rouge), which bleeds a glaring light pill into
     dark mode behind chips like [preprint] / [ongoing since] — measured 2.89:1. Re-assert transparent. */
  .page__content code.highlighter-rouge{ background:transparent; }

  .page__content blockquote{ border-left:2px solid var(--accent); background:var(--panel); font-style:italic;
    margin:1.1em 0; padding:.5em 1.1em; color:var(--ink); }
  .page__content hr{ border:0; border-top:1px solid var(--rule); margin:2.4em 0; }

  /* tables (the evaluator's health-summary tables) — the theme's table skin assumes the light
     palette (banded grey header, grey text), which reads near-invisible on dark paper.
     Re-skin variable-driven so both modes follow the tokens. */
  .page__content table{ font-family:var(--sans); font-size:.8em; border:1px solid var(--hair);
    border-collapse:collapse; background:transparent; }
  .page__content th{ background:var(--panel); color:var(--ink); font-weight:600;
    border:1px solid var(--hair); }
  .page__content td{ border:1px solid var(--hair); background:transparent; color:var(--ink); }
  .page__content tbody tr:nth-child(even), .page__content tbody tr:nth-child(even) td{
    background:transparent; }

  @media (max-width:680px){
    .page__title{ font-size:1.9em; }
    /* comfortable tap targets (>=44px) without shifting layout (padding offset by negative margin) */
    .fb-btn{ padding:.6em 1em; min-height:44px; display:inline-flex; align-items:center; }
  }

  /* home / archive contents list */
  .archive__item-title{ font-family:var(--display); font-weight:600; }
  .archive__item-title a{ text-decoration:none; }
  .archive__item-excerpt{ font-family:var(--serif); color:var(--muted); }
  .list__item{ border-bottom:1px solid var(--hair); padding-bottom:1em; margin-bottom:1em; }
  .archive__subtitle{ font-family:var(--sans); text-transform:uppercase; letter-spacing:.12em; font-size:.9em;
    color:var(--muted); border-bottom:1px solid var(--rule); }

  /* footer — small sans, recedes */
  .page__footer{ background:var(--paper); border-top:1px solid var(--rule); color:var(--muted-ui);
    font-family:var(--sans); font-size:.8em; }
  .page__footer a,.page__footer-copyright{ color:var(--muted-ui); }
  .page__footer a{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; }

  /* propose-form buttons — variable-driven, follows light/dark.
     controls keep a >=3:1 border (--muted-ui) per WCAG 1.4.11. */
  .fb-btn{ border:1px solid var(--muted-ui); }
  .fb-btn:hover{ background:var(--hair); }
  /* readable placeholders (the stock ~50% grey fails AA in light mode) */
  .propose__topic::placeholder, .propose__detail::placeholder{
    color:var(--muted-ui); opacity:1; }
</style>
<script>
  // Strip the leading section-header emoji for a cleaner editorial look; the tracked kicker
  // styling carries the hierarchy. Only mutates the rendered page — source briefs are untouched.
  document.addEventListener('DOMContentLoaded', function () {
    var c = document.querySelector('.page__content'); if (!c) return;
    // Strip a leading emoji run (incl. variation selectors / ZWJ sequences) + trailing space.
    // Prefer Unicode property escapes; fall back to the legacy literal range on old engines.
    var LEAD;
    try { LEAD = /^(?:(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍\p{Extended_Pictographic})*\s*)+/u; }
    catch (e) { LEAD = /^[\s←-⯿☀-➿\uD800-\uDFFF️‍]+/; }
    c.querySelectorAll('h2, h3').forEach(function (h) {
      var n = h.firstChild;
      if (n && n.nodeType === 3) n.nodeValue = n.nodeValue.replace(LEAD, '');
    });
  });
</script>
