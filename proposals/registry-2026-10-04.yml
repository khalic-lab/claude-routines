  # Primary-chemistry candidates from the Sunday scout. Science was again the worst-deficit stream
  # (new_domains 3 = exactly its weekly-tier floor and the lowest ratio of any stream; unique_domains 5
  # vs the >=10 target; top5_share 1.00; waiver_rate 0.75). The registry's science roster is otherwise
  # comprehensive -- physics (journals.aps.org, pubs.aip.org, iopscience.iop.org), bio (cell.com,
  # elifesciences.org, plos.org, biorxiv.org), multidisciplinary (nature.com, science.org, pnas.org),
  # geo (agu.org), preprints (arxiv.org, chemrxiv.org), and royalsociety.org/pubs.aip.org added last
  # week -- but it has NO peer-reviewed chemistry primary (only the chemrxiv preprint server). These two
  # fill that gap. Both 403/000'd the evaluator egress, so reach: proxy-needed and the writers vet at
  # first citation. CAVEAT (as every prior science-scout note): science's deficit is structural
  # (narrow primary-journal universe + institutional egress wall), not a candidate shortage -- these
  # broaden the chemistry bench but the binding constraint stays reachability (this window the science
  # writer's own feeds eso.org/home.cern/physics.aps.org/link.aps.org/api.openalex.org all failed).
  - domain: pubs.acs.org
    action: add
    proposed_status: candidate
    reach: proxy-needed
    stream: science
    evidence: >-
      American Chemical Society -- primary peer-reviewed chemistry journals (JACS, Nano Letters, J. Phys.
      Chem., Chem. Mater.). Genuine primary publisher absent from the registry; the science stream has no
      chemistry-primary anchor beyond the chemrxiv preprint server. Needs a probation cycle.
  - domain: pubs.rsc.org
    action: add
    proposed_status: candidate
    reach: proxy-needed
    stream: science
    evidence: >-
      Royal Society of Chemistry -- primary chemistry journals (Chemical Science [gold OA], Chem. Commun.,
      Energy & Environmental Science). Complements ACS for the same gap; EES is a leading sustainable-energy
      venue relevant to the reader's CH/climate interest. Needs a probation cycle.
