title: "News"
description: "An automated news desk — researched, written and published on a schedule."
url: "https://khalic-lab.github.io"
baseurl: "/claude-routines"
lang: en

# No theme since 2026-09-24: the site owns its layouts (_layouts/default, home, single, admin),
# its head (_includes/head.html: jekyll-seo-tag + the feed link) and its CSS/JS under assets/.
# Pages applies jekyll-theme-primer when no theme is named; null keeps its stylesheet and layouts out.
theme: null
permalink: /:year/:month/:day/:title/
timezone: Europe/Zurich

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      # 2026-07-18: individual brief pages retired — the homepage story feed carries every
      # story's full prose, so per-edition pages are redundant. The _posts/*.md files STAY
      # (they feed homefeed.json, stats, and the Evaluator); only the rendered pages go.
      # Evaluator reviews opt back in with `published: true` in their front matter — their
      # content is NOT on the homepage.
      published: false

exclude:
  - briefs           # legacy pre-Pages layout (deleted 2026-07-03); guard should it reappear
  - bridge.sh
  - HANDOFF.md
  - ARCHITECTURE.md
  - CLAUDE.md          # agent ops manual — trigger IDs, env, bridge paths; internal, never published
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - watches.yml
  - pending-notifications
  - tools
  - index/stories  # dedup data dir; NOT bare "index" — that prefix-matches index.md and kills the homepage
  - index/ledger   # story-store event ledger (2026-07-07); same bare-"index" caveat as above
  - index/usage    # measured per-run token-usage records; admin-read, never published; same bare-"index" caveat
  - index/admin    # queued/applied admin actions log; admin-read, never published; same bare-"index" caveat
  - sources        # source registry + credibility lifecycle; writer/Evaluator-read, never published
  - feedback           # reader-feedback data + FEEDBACK.md (writer/Evaluator-read, never published)
  - proposals          # brief proposals drained from the site form; reviewed, never published
  - reader-profile.md  # editorial brief the writers read at compose time; not a page
  - reader-profile     # source-weights.yml; writer-read, not published
  - routines           # snapshots of the claude.ai RemoteTrigger prompts; private editorial config, never published
  - diagrams           # mermaid architecture diagrams; reference env/trigger IDs + Worker URLs, never published
  - docs               # design proposals (SPIKE-*) + dated archive (AUDIT/REVIEW/PRIOR-ART/DEDUP-DIAGNOSIS); internal
  - "*.gemspec"
  - README.md
