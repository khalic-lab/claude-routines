name = "feedback-sink"
main = "src/worker.js"
compatibility_date = "2025-05-01"

# KV holding pen for feedback records between /submit (browser) and /drain (bridge).
# Create it once and paste the printed id here:
#   wrangler kv namespace create FEEDBACK_KV
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "005fab1cb5f842cb91a6dce43c973bfd"

[observability]
enabled = true

# /admin/* is ONE passkey: the WebAuthn credential id(s) whose sessions may read the snapshot and
# queue source actions (comma-separated). A credential id is a public handle -- the private key
# never leaves the device -- so it can live here. Unset = every admin route refuses (fail closed).
[vars]
ADMIN_CRED_IDS = "0j4qYzqrXu5gxThszOr0enwYnA8"
